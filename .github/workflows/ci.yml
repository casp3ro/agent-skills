name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate-skills:
    name: Build and validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check generated files and validate skills
        run: npm run check

  validate-swift:
    name: Compile and test Swift examples
    runs-on: macos-26
    defaults:
      run:
        working-directory: validation/SwiftSkillValidation
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build
        run: swift build
      - name: Test with Thread Sanitizer
        run: swift test --sanitize=thread
